# Builds the web version of the app and publishes it with GitHub Pages:
#   https://<owner>.github.io/<repo>/
# Runs on every push to main, or by hand (Actions tab > Deploy website > Run workflow).
#
# Accounts, notes and documents need a cloud Supabase project. When you have one, add
# repository variables (Settings > Secrets and variables > Actions > Variables):
#   EXPO_PUBLIC_SUPABASE_URL   e.g. https://abcd1234.supabase.co
#   EXPO_PUBLIC_SUPABASE_KEY   the project's publishable (anon) key — safe to publish
# Without them the site still works for reading and the Hebrew/Greek view.
name: Deploy website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push replaces a queued one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint .

      - name: Build website
        env:
          WEB_BASE_URL: /${{ github.event.repository.name }}
          EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_KEY }}
        run: npx expo export --platform web --output-dir dist

      - name: Prepare for GitHub Pages
        # 404.html = the app itself, so links like /bible-app/notes work when opened directly.
        run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
